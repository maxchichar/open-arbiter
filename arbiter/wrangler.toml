# Open Arbiter Worker. ADR 0004 (written in P1.4) records the environment design.
#
# The top level is LOCAL DEVELOPMENT ONLY (`wrangler dev --local`, `npm run test:worker`). Its ids
# are placeholders, so a bare `wrangler deploy` fails. Wrangler only warns when --env is missing,
# so deploy with `npm run deploy:arbiter -- <staging|production>`, which refuses without one.
#
# Each environment deploys as its own Worker (open-arbiter-staging, open-arbiter-production) with its
# own D1, KV and secrets. Bindings and `secrets` are not inherited, so each section lists them all.
# Never define DEV here (arbiter/test/config-guard.test.mjs); it comes only from the gitignored .dev.vars.
#
# Secrets, set per environment with `npx wrangler secret put <NAME> --env <env>` (never in the repo):
#   ADMIN_TOKEN          registers vendors
#   ARBITER_SIGNING_JWK  private ECDSA P-256 JWK, one per environment (node scripts/keygen.mjs). Without it the
#                        arbiter refuses to sign (500 misconfigured). Local dev only: DEV=1 in .dev.vars makes one in D1.
#   BUYER_SALT           salt for hashing caller IPs
# `secrets.required` makes `wrangler deploy` fail while any of them is unset. It is not set at the top
# level, because in `wrangler dev` it would load only the listed keys from .dev.vars (dropping DEV).

name = "open-arbiter"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
# No per-version preview URLs: they would let anyone call an older uploaded version against the
# environment's database. Inherited by both environments.
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "open-arbiter"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "AUDIT_ANCHOR"
id = "00000000000000000000000000000000"

# Workers Logs (P1.5): one JSON object per request (src/log.js). Repeated in each environment, as the
# Workers Logs docs do (2026-11-18); arbiter/test/wrangler-env.test.mjs reads the resolved config.
[observability]
enabled = true
head_sampling_rate = 1

# Cloudflare's own invocation logs record "the Request, Response, and related metadata"; the docs
# (2026-11-18) do not say whether headers (Authorization tokens) or the caller IP are left out, so
# they are off. Our line (src/log.js) has route, status, code and duration. P1.8 checks staging.

[observability.logs]
invocation_logs = false

# The environment name in every log line. vars are not inherited, so each environment sets its own.
[vars]
ENVIRONMENT = "local"
# P1.7: requests per IP per 60 s (quota.js). Local dev is one loopback IP for every script, so it is
# higher here; staging and production use the default, 100. IP_RATE_LIMIT below says the same.
IP_LIMIT_PER_60S = "1000"
# Negotiations per item per address per 24 h: load protection (ADR 0001: the price leakage bound
# does not depend on it). 20 everywhere since 2026-11-27 (carrier-grade NAT).
MANDATES_PER_ITEM_PER_DAY = "20"

# P1.7: the Workers rate-limiting binding, per Cloudflare location, keyed by the salted IP hash.
# Each environment has its own namespace (counters are shared within a namespace across Workers).
[[ratelimits]]
name = "IP_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 1000, period = 60 }

# The Worker version in /health and every log line (P1.6). Not inherited by [env.X] (checked with
# wrangler 4.166.0's config reader), so each environment declares it.
[version_metadata]
binding = "CF_VERSION_METADATA"

# ---------- staging ----------
[env.staging]
workers_dev = true

[env.staging.secrets]
required = ["ADMIN_TOKEN", "ARBITER_SIGNING_JWK", "BUYER_SALT"]

[env.staging.vars]
ENVIRONMENT = "staging"
IP_LIMIT_PER_60S = "100"
MANDATES_PER_ITEM_PER_DAY = "20"

[[env.staging.ratelimits]]
name = "IP_RATE_LIMIT"
namespace_id = "2001"
simple = { limit = 100, period = 60 }

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
invocation_logs = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "open-arbiter-staging"
# Created 2026-11-27 (approval A1), region WEUR; docs/rpi/phase-1/evidence/p1.1-staging-resources.md
database_id = "922441f6-7046-437e-8a7a-b7c1ac2e2c6f"

[[env.staging.kv_namespaces]]
binding = "AUDIT_ANCHOR"
# Namespace "open-arbiter-staging-audit-anchor", created 2026-11-27 (approval A1)
id = "8476675c8fb84377993c998b92144749"

[env.staging.triggers]
crons = ["0 2 * * *"]

# ---------- production ----------
[env.production]
workers_dev = true

[env.production.secrets]
required = ["ADMIN_TOKEN", "ARBITER_SIGNING_JWK", "BUYER_SALT"]

[env.production.vars]
ENVIRONMENT = "production"
IP_LIMIT_PER_60S = "100"
MANDATES_PER_ITEM_PER_DAY = "20"

[[env.production.ratelimits]]
name = "IP_RATE_LIMIT"
namespace_id = "3001"
simple = { limit = 100, period = 60 }

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
invocation_logs = false

[[env.production.d1_databases]]
binding = "DB"
database_name = "open-arbiter-production"
# Replace with the id printed by `npx wrangler d1 create open-arbiter-production` (approval A3).
database_id = "00000000-0000-0000-0000-00000000000b"

[[env.production.kv_namespaces]]
binding = "AUDIT_ANCHOR"
# Replace with the id printed by `npx wrangler kv namespace create AUDIT_ANCHOR --env production` (approval A3).
id = "0000000000000000000000000000000b"

[env.production.triggers]
crons = ["0 2 * * *"]
