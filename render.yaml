services:
  - type: worker
    name: discord-away-bot
    env: python
    plan: starter # $7/mo — no cold starts/sleeping; required for 24/7 uptime
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: away-bot-data
      mountPath: /var/data
      sizeGB: 1 # ~$0.25/mo — keeps the away-status database across restarts/deploys
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NIM_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: DB_PATH
        value: /var/data/away_bot.db
